<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Terima Kasih</title>
<style>
body{font-family:system-ui,sans-serif;background:#0e1530;color:#f4f6ff;min-height:100vh;display:grid;place-items:center;margin:0;padding:24px}
.card{max-width:460px;width:100%;text-align:center;border-radius:24px;border:1px solid rgba(255,255,255,.2);padding:36px 26px;background:#18214a}
.ok{width:64px;height:64px;margin:0 auto 18px;border-radius:50%;display:grid;place-items:center;font-size:32px;background:#35d6e8;color:#06122e}
.eid{margin-top:16px;padding:8px 10px;border-radius:8px;background:rgba(0,0,0,.3);font-family:monospace;font-size:11px;word-break:break-all;color:#9ecbff}
</style>
</head>
<body>
<div class="card">
<div class="ok">✓</div>
<h1>Terima kasih!</h1>
<p>Data kamu sudah kami terima. Kami akan menghubungi lewat WhatsApp atau email secepatnya.</p>
<div class="eid" id="eid">event_id: -</div>
</div>
<script>
var eid=new URLSearchParams(location.search).get('eid')||'-';
document.getElementById('eid').textContent='event_id: '+eid;
console.log('eid:',eid);
</script>
</body>
</html>
