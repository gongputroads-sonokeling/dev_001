<script>
(function(){

WEBAPP_URL:'https://script.google.com/macros/s/AKfycbyyEXiwJiaOVPOLetPHUaeP_dnGl9t9Lz009SijiUhv_R21ijnVZluBfCA__C7iKdhS/exec',
THANKS_URL:'terima-kasih_2.html',

function log(){if(CFG.DEBUG&&console)console.log.apply(console,arguments);}
function newId(){var r=(crypto&&crypto.randomUUID)?crypto.randomUUID():'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,function(c){var v=Math.random()*16|0;return(c=='x'?v:(v&3|8)).toString(16);});return 'lead_'+Date.now()+'_'+r;}
function getCookie(n){var m=document.cookie.match(new RegExp('(?:^|; )'+n+'=([^;]*)'));return m?decodeURIComponent(m[1]):'';}
var qs=new URLSearchParams(location.search);function getP(k){try{return sessionStorage.getItem(k)||qs.get(k)||'';}catch(_){return qs.get(k)||'';}}
['utm_source','fbclid'].forEach(function(k){var v=qs.get(k);if(v){try{sessionStorage.setItem(k,v);}catch(_){}}});

var st=document.getElementById('status');
btn.addEventListener('click',function(){

var phone=document.getElementById('Phone').value.trim();
var email=document.getElementById('Email').value.trim();
var comp=document.getElementById('Company').value.trim()||'Pribadi';

if(phone.replace(/\D/g,'').length<9){alert('HP tidak valid');return;}
btn.disabled=true; btn.textContent='Mengirim...'; st.textContent='Mengirim Pixel + Sheet...';

var fbclid=getP('fbclid');
var fbc=getCookie('_fbc')||(fbclid?('fb.1.'+Date.now()+'.'+fbclid):'');

if(window.fbq){fbq('track','Lead',{},{eventID:eid}); log('V4 Pixel Lead',eid);}
st.textContent='Pixel terkirim: '+eid+' - Kirim ke Sheet...';

fetch(CFG.WEBAPP_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)}).then(function(){log('Fetch OK');go();},function(e){log('Fetch fail',e);go();});
setTimeout(go,2000);
});
