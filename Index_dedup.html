<style>
:root{--ink:#0e1530;--ink2:#18214a;--line:rgba(255,255,255,.2);--txt:#f4f6ff;--mute:rgba(244,246,255,.74);--blue:#3d7bff;--cyan:#35d6e8;--amber:#ffc857}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;color:var(--txt);background:radial-gradient(120% 90% at 20% 0%,var(--ink2),var(--ink) 60%);min-height:100vh;overflow-x:hidden}
.orb{position:fixed;border-radius:50%;filter:blur(70px);opacity:.55;pointer-events:none;transition:transform .4s ease-out}
.o1{width:380px;height:380px;background:var(--blue);top:-120px;left:-100px;transform:translate(calc(var(--px,0)*50px),calc(var(--py,0)*50px))}
.o2{width:320px;height:320px;background:#8a5cff;bottom:-100px;right:-60px;transform:translate(calc(var(--px,0)*-70px),calc(var(--py,0)*-70px))}
.o3{width:200px;height:200px;background:var(--cyan);top:45%;left:48%;opacity:.3;transform:translate(calc(var(--px,0)*30px),calc(var(--py,0)*-40px))}
.wrap{position:relative;max-width:520px;margin:0 auto;padding:40px 20px 56px;min-height:100vh;display:grid;align-items:center}
h1{font-size:clamp(32px,5.4vw,56px);line-height:1.06;letter-spacing:-.025em;margin:0 0 16px;font-weight:800}
.sub{font-size:18px;line-height:1.55;color:var(--mute);max-width:46ch;margin:0 0 26px}
.perks{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.perks li{display:flex;gap:12px;align-items:center;color:var(--txt);font-size:16px}
.perks i{flex:none;width:26px;height:26px;border-radius:8px;background:linear-gradient(145deg,var(--cyan),var(--blue));display:grid;place-items:center;font-style:normal;font-size:14px;font-weight:800;color:#06122e;box-shadow:0 3px 0 #1c4fc2}

.stage{perspective:1100px;padding:18px}
.deck{position:relative;transform-style:preserve-3d;transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .18s ease-out}
.deck::before,.deck::after{content:"";position:absolute;inset:0;border-radius:24px;border:1px solid var(--line);background:rgba(255,255,255,.05)}
.deck::before{transform:translate3d(14px,16px,-40px)}
.deck::after{transform:translate3d(28px,32px,-80px);opacity:.6}
.card{position:relative;transform-style:preserve-3d;border-radius:24px;border:1px solid var(--line);padding:28px 24px;background:linear-gradient(160deg,rgba(255,255,255,.16),rgba(255,255,255,.05)),var(--ink2);box-shadow:0 30px 60px rgba(0,0,0,.4)}
.card::after{content:"";position:absolute;inset:0;border-radius:24px;pointer-events:none;background:radial-gradient(260px circle at var(--mx,30%) var(--my,10%),rgba(255,255,255,.18),transparent 60%)}
.card h2{margin:0 0 4px;font-size:22px;transform:translateZ(34px)}
.card .hint{margin:0 0 20px;color:var(--mute);font-size:14px;transform:translateZ(22px)}
.field{position:relative;margin-bottom:16px;transform:translateZ(18px)}
.field input{width:100%;padding:22px 14px 8px;font-size:16px;color:var(--txt);background:rgba(255,255,255,.08);border:1px solid var(--line);border-radius:12px;outline:0;transition:border-color .2s,box-shadow .2s,background .2s}
.field label{position:absolute;left:15px;top:16px;font-size:16px;color:var(--mute);pointer-events:none;transition:transform .2s,font-size .2s,color .2s;transform-origin:left top}
.field input:focus{border-color:var(--cyan);background:rgba(255,255,255,.12);box-shadow:0 0 0 4px rgba(53,214,232,.2)}
.field input:focus+label,.field input:not(:placeholder-shown)+label{transform:translateY(-10px);font-size:12px;color:var(--cyan)}
.msg{display:block;min-height:0;font-size:13px;color:var(--amber);margin:6px 2px 0}
.msg:empty{display:none}
.field.bad input{border-color:var(--amber)}
.field.bad{animation:shake .35s}
@keyframes shake{25%{translate:-6px}75%{translate:6px}}
.btn{width:100%;margin-top:6px;padding:16px;border:0;border-radius:14px;font:inherit;font-size:17px;font-weight:800;color:#06122e;cursor:pointer;background:linear-gradient(180deg,var(--cyan),var(--blue));box-shadow:0 7px 0 #1c4fc2,0 16px 28px rgba(61,123,255,.4);transform:translateZ(40px);transition:transform .08s,box-shadow .08s,filter .2s}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:translateZ(40px) translateY(5px);box-shadow:0 2px 0 #1c4fc2,0 6px 12px rgba(61,123,255,.4)}
.btn:disabled{filter:grayscale(.4);cursor:progress}
.btn:focus-visible,.field input:focus-visible{outline:3px solid var(--amber);outline-offset:3px}
.fine{margin:14px 0 0;font-size:12.5px;color:var(--mute);line-height:1.5;transform:translateZ(14px)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.deck{transform:none!important}}
</style>
</head>
<body>
<span class="orb o1"></span><span class="orb o2"></span><span class="orb o3"></span>

<main class="wrap">
  <section class="stage" id="stage">
    <div class="deck" id="deck">
      <div class="card">
        <h2>Daftar sekarang</h2>
        <p class="hint">Isi data singkat di bawah ini.</p>

        <!-- Form HTML biasa (pengganti Zoho Web-to-Lead). Dikirim lewat JavaScript, bukan action/method. -->
        <form id="leadForm" name="leadForm" accept-charset="UTF-8" novalidate>
          <!-- Honeypot anti-spam: harus tetap kosong -->
          <input type="text" style="display:none;" name="aG9uZXlwb3Q" value="" tabindex="-1" autocomplete="off" />

          <div class="field">
            <input type="text" id="Last_Name" name="Last Name" maxlength="80" placeholder=" " autocomplete="name" aria-required="true" />
            <label for="Last_Name">Nama lengkap</label>
            <span class="msg" role="alert"></span>
          </div>
          <div class="field">
            <input type="tel" id="Phone" name="Phone" maxlength="30" placeholder=" " autocomplete="tel" inputmode="tel" aria-required="true" />
            <label for="Phone">No. HP / WhatsApp</label>
            <span class="msg" role="alert"></span>
          </div>
          <div class="field">
            <input type="email" id="Email" name="Email" maxlength="100" placeholder=" " autocomplete="email" />
            <label for="Email">Email (opsional)</label>
            <span class="msg" role="alert"></span>
          </div>
          <div class="field">
            <input type="text" id="Company" name="Company" maxlength="200" placeholder=" " autocomplete="organization" />
            <label for="Company">Nama usaha atau instansi (opsional)</label>
            <span class="msg" role="alert"></span>
          </div>

          <button type="submit" class="btn" id="formsubmit">SUBMIT</button>
          <p class="fine">Dengan mengirim data, kamu setuju dihubungi lewat WhatsApp atau email.</p>
        </form>
      </div>
    </div>
  </section>
</main>

<script>
(function(){
  var root=document.documentElement,stage=document.getElementById('stage'),deck=document.getElementById('deck');
  var calm=matchMedia('(prefers-reduced-motion: reduce)').matches;

  if(!calm){
    stage.addEventListener('pointermove',function(e){
      var r=stage.getBoundingClientRect(),x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;
      deck.style.setProperty('--ry',((x-.5)*14).toFixed(1)+'deg');
      deck.style.setProperty('--rx',((.5-y)*14).toFixed(1)+'deg');
      deck.style.setProperty('--mx',(x*100).toFixed(0)+'%');
      deck.style.setProperty('--my',(y*100).toFixed(0)+'%');
    });
    stage.addEventListener('pointerleave',function(){
      deck.style.setProperty('--rx','0deg');deck.style.setProperty('--ry','0deg');
    });
    document.addEventListener('pointermove',function(e){
      root.style.setProperty('--px',(e.clientX/innerWidth-.5).toFixed(3));
      root.style.setProperty('--py',(e.clientY/innerHeight-.5).toFixed(3));
    });
  }

  /* =====================================================================
     BAGIAN BARU (BAHAN BELAJAR): EVENT_ID + PIXEL + KIRIM KE APPS SCRIPT
     ===================================================================== */
  var CFG={
    WEBAPP_URL:'https://script.google.com/macros/s/AKfycbyhzMKWvGzVQ6gqBOuPdvMVM8eT0OixpQIvNv1bLKRJKHCfV9NQvVJhOZ804CedEzDX/exec' // GANTI JIKA DEPLOY BARU,   // TODO: isi URL Web App Apps Script (akhiran /exec). Kosong = mode uji Pixel saja
    THANKS_URL:'terima-kasih_01.html',   // halaman terima kasih ada di folder yang sama (repo dev_001)
    DEBUG:true       // true = tampilkan log di Console (F12). Ubah ke false saat produksi
  };

  function log(){
    if(CFG.DEBUG&&window.console){console.log.apply(console,['[EVENT_ID]'].concat([].slice.call(arguments)));}
  }

  // 1) Buat event_id unik, dipakai SAMA PERSIS oleh Pixel dan CAPI
  function newEventId(){
    var rnd=(window.crypto&&crypto.randomUUID)?crypto.randomUUID()
      :'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,function(c){
        var r=Math.random()*16|0;return(c==='x'?r:(r&3|8)).toString(16);});
    return 'lead_'+Date.now()+'_'+rnd;
  }

  // 2) Ambil cookie _fbp dan _fbc (menaikkan Event Match Quality)
  function getCookie(n){
    var m=document.cookie.match(new RegExp('(?:^|; )'+n+'=([^;]*)'));
    return m?decodeURIComponent(m[1]):'';
  }

  // 3) Simpan UTM dan fbclid saat halaman dibuka (supaya tidak hilang)
  var qs=new URLSearchParams(location.search);
  ['utm_source','utm_medium','utm_campaign','utm_content','utm_term','fbclid'].forEach(function(k){
    var v=qs.get(k);
    if(v){try{sessionStorage.setItem(k,v);}catch(_){}}
  });
  function getParam(k){
    try{return sessionStorage.getItem(k)||qs.get(k)||'';}catch(_){return qs.get(k)||'';}
  }

  // 4) Kirim Lead: Pixel (browser) + Apps Script (server/CAPI), event_id sama
  function sendLead(f,btn){
    var eventId=newEventId();
    var fbclid=getParam('fbclid');
    var fbc=getCookie('_fbc')||(fbclid?('fb.1.'+Date.now()+'.'+fbclid):'');

    var payload={
      event_name:'Lead',
      event_id:eventId,
      event_time:Math.floor(Date.now()/1000),
      event_source_url:location.href,
      user_agent:navigator.userAgent,
      fbp:getCookie('_fbp'),
      fbc:fbc,
      nama:f.elements['Last Name'].value.trim(),
      phone:f.elements['Phone'].value.trim(),
      email:f.elements['Email'].value.trim(),
      company:f.elements['Company'].value.trim(),
      utm_source:getParam('utm_source'),
      utm_medium:getParam('utm_medium'),
      utm_campaign:getParam('utm_campaign'),
      utm_content:getParam('utm_content'),
      utm_term:getParam('utm_term')
    };

    // Mapping ke Sheet Leads: Timestamp | Name | Phone | Email | event_id | fbp | fbc | utm_source | page_url | Status | event_name
    // Sisi browser: Pixel dengan eventID
    if(window.fbq){fbq('track','Lead',{},{eventID:eventId});}
    log('Pixel Lead terkirim, eventID =',eventId);
    log('Payload ke Apps Script:',payload);

    // Mode uji: belum ada URL Web App, hanya Pixel
    if(!CFG.WEBAPP_URL){
      log('WEBAPP_URL kosong: hanya Pixel yang dikirim, halaman tidak dialihkan.');
      setTimeout(function(){btn.disabled=false;btn.textContent='SUBMIT';},1200);
      return;
    }

    // Sisi server: kirim ke Apps Script (text/plain agar tidak kena preflight CORS)
    var done=false;
    function go(){
      if(done)return;done=true;
      location.href=CFG.THANKS_URL+'?eid='+encodeURIComponent(eventId);
    }
    fetch(CFG.WEBAPP_URL,{
      method:'POST',mode:'no-cors',keepalive:true,
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify(payload)
    }).then(go,go);
    setTimeout(go,1500); // jaga-jaga jika jaringan lambat
  }
  /* ===================== AKHIR BAGIAN BARU ===================== */

  var f=document.getElementById('leadForm'),btn=document.getElementById('formsubmit');

  function fail(name,text,e){
    var el=f.elements[name],box=el.closest('.field');
    box.classList.remove('bad');void box.offsetWidth;box.classList.add('bad');
    box.querySelector('.msg').textContent=text;
    el.focus();e.preventDefault();
  }
  f.addEventListener('input',function(e){
    var box=e.target.closest('.field');
    if(box){box.classList.remove('bad');box.querySelector('.msg').textContent='';}
  });

  f.addEventListener('submit',function(e){
    e.preventDefault();
    if(f.elements['aG9uZXlwb3Q'].value){return;} // honeypot terisi = bot
    var name=f.elements['Last Name'].value.trim(),
        digits=f.elements['Phone'].value.replace(/\D/g,''),
        mail=f.elements['Email'].value.trim();
    if(!name){return fail('Last Name','Isi nama lengkap kamu.',e);}
    if(digits.length<9||digits.length>15){return fail('Phone','Masukkan nomor HP atau WhatsApp aktif, contoh 0812xxxxxxx.',e);}
    if(mail&&!/^[^@\s]+@[^@\s]+\.[^@\s]{2,}$/.test(mail)){return fail('Email','Format email belum benar, contoh nama@email.com.',e);}
    if(!f.elements['Company'].value.trim()){f.elements['Company'].value='Pribadi';}
    btn.disabled=true;btn.textContent='Mengirim...';
    sendLead(f,btn);
  });

  addEventListener('pageshow',function(){btn.disabled=false;btn.textContent='SUBMIT';});
})();
</script>
</body>
</html>
