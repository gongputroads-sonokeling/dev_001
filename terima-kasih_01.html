<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>Terima Kasih</title>
<!-- Sengaja TANPA Meta Pixel: event Lead sudah dikirim dari index.html (dengan event_id),
     jadi halaman ini tidak boleh menembak Lead lagi supaya tidak terhitung dobel. -->
<style>
:root{--ink:#0e1530;--ink2:#18214a;--line:rgba(255,255,255,.2);--txt:#f4f6ff;--mute:rgba(244,246,255,.74);--blue:#3d7bff;--cyan:#35d6e8}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;color:var(--txt);background:radial-gradient(120% 90% at 20% 0%,var(--ink2),var(--ink) 60%);min-height:100vh;display:grid;place-items:center;padding:24px}
.card{max-width:460px;width:100%;text-align:center;border-radius:24px;border:1px solid var(--line);padding:36px 26px;background:linear-gradient(160deg,rgba(255,255,255,.16),rgba(255,255,255,.05)),var(--ink2);box-shadow:0 30px 60px rgba(0,0,0,.4)}
.ok{width:64px;height:64px;margin:0 auto 18px;border-radius:50%;display:grid;place-items:center;font-size:32px;font-weight:800;color:#06122e;background:linear-gradient(145deg,var(--cyan),var(--blue))}
h1{margin:0 0 10px;font-size:26px}
p{margin:0;color:var(--mute);line-height:1.6}
</style>
</head>
<body>
<main class="card">
  <div class="ok">&#10003;</div>
  <h1>Terima kasih!</h1>
  <p>Data kamu sudah kami terima. Kami akan menghubungi lewat WhatsApp atau email secepatnya.</p>
</main>
<script>
// Hanya untuk belajar: tampilkan event_id yang dibawa dari index.html (lihat di Console)
(function(){
  var eid=new URLSearchParams(location.search).get('eid');
  if(window.console){console.log('[EVENT_ID] eid dari index.html =',eid);}
})();
</script>
</body>
</html>
